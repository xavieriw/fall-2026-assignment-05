<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ember &amp; Bean Coffee Roasters | Store</title>
    <link rel="icon" type="image/svg+xml" href="./images/logo.svg" />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a class="brand" href="./index.html">
          <img src="./images/logo.svg" alt="" width="36" height="36" />
          <span>Ember &amp; Bean</span>
        </a>
        <ul class="nav-links">
          <li><a href="./index.html">Home</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./store.html" aria-current="page">Store</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="page-banner">
        <div class="container">
          <p class="eyebrow">The roastery shop</p>
          <h1>Shop Coffee &amp; Gear</h1>
        </div>
      </section>

      <section class="section container">
        <div id="product-grid" class="product-grid" aria-live="polite"></div>

        <nav class="pagination" aria-label="Product pages">
          <button id="prev-btn" class="btn btn-secondary" type="button">
            &larr; Previous
          </button>
          <span id="page-indicator" class="page-indicator">Page 1 of 3</span>
          <button id="next-btn" class="btn btn-secondary" type="button">
            Next &rarr;
          </button>
        </nav>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <strong>Ember &amp; Bean Coffee Roasters</strong>
          <p>Mon–Fri 7am–6pm · Sat–Sun 8am–4pm</p>
        </div>
        <ul class="social-links">
          <li><a href="#" aria-label="Instagram">Instagram</a></li>
          <li><a href="#" aria-label="Facebook">Facebook</a></li>
          <li><a href="#" aria-label="TikTok">TikTok</a></li>
        </ul>
        <p class="copyright">
          &copy; <span class="year">2026</span> Ember &amp; Bean. All rights
          reserved.
        </p>
      </div>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
